plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.freedom.remoteaccess'
    compileSdk 34

    defaultConfig {
        applicationId "com.freedom.remoteaccess"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1-prototipo"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // WebRTC para Android (captura de tela, áudio e conexão P2P)
    implementation 'io.getstream:stream-webrtc-android:1.1.1'

    // Cliente Supabase (Realtime = canal de sinalização, Postgrest = tabelas)
    implementation platform('io.github.jan-tennert.supabase:bom:2.6.0')
    implementation 'io.github.jan-tennert.supabase:realtime-kt'
    implementation 'io.ktor:ktor-client-okhttp:2.3.12'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Leitura do QR de pareamento (câmera + decodificação do código)
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // Localização da frota (velocidade, histórico do dia)
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'io.github.jan-tennert.supabase:postgrest-kt'
}
