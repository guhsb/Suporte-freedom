name: Build do app desktop (Windows .exe)

on:
  push:
    branches: [main]
    paths:
      - "electron-app/**"
      - ".github/workflows/build-electron.yml"
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Gerar o .exe
        run: npm run dist

      - name: Publicar o instalador como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: freedom-suporte-remoto-windows
          path: electron-app/dist/*.exe
