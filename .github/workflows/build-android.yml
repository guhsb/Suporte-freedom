name: Build do app Android (APK)

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Usar o Android SDK que já vem no runner (sem reinstalar)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Aceitar as licenças do SDK
        run: |
          mkdir -p /usr/local/lib/android/sdk/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > /usr/local/lib/android/sdk/licenses/android-sdk-preview-license

      - name: Instalar a plataforma e build-tools necessários
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Instalar o Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar o APK de debug
        run: gradle :app:assembleDebug

      - name: Publicar o APK como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: freedom-suporte-remoto-android
          path: android-app/app/build/outputs/apk/debug/*.apk
